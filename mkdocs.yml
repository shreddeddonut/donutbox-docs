site_name: Donutbox
site_url: https://donutbox.dev
site_author: shreddeddonut
site_description: Donutbox project page - scripts, snippets, and homelab notes.

edit_uri: https://github.com/shreddeddonut/donutbox-docs/edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: donutbox-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: donutbox-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shreddeddonut

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - macOS:
      - macos/index.md
      - Scripts: macos/scripts.md
      - Snippets: macos/snippets.md
      - Notes: macos/notes.md
  - Jamf:
      - jamf/index.md
      - Scripts: jamf/scripts.md
      - Snippets: jamf/snippets.md
      - Notes: jamf/notes.md
  - Linux:
      - linux/index.md
      - Scripts: linux/scripts.md
      - Snippets: linux/snippets.md
      - Notes: linux/notes.md
  - Windows:
      - windows/index.md
      - Scripts: windows/scripts.md
      - Snippets: windows/snippets.md
      - Notes: windows/notes.md
  - Homelab:
      - homelab/index.md
      - Scripts: homelab/scripts.md
      - Snippets: homelab/snippets.md
      - Notes: homelab/notes.md
  - Scripts: scripts/index.md
