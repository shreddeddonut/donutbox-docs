site_name: Donutbox
site_url: https://donutbox.dev
site_author: shreddeddonut
site_description: Donutbox - code snippets, scripts, tools, and apps.

edit_uri: https://github.com/shreddeddonut/donutbox-docs/edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: donutbox-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: donutbox-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shreddeddonut

plugins:
  - search
  - tags
  - git-revision-date-localized:
      type: timeago
      enable_creation_date: true
  - meta-descriptions
  - minify:
      minify_html: true
  - social

hooks:
  - hooks/llms_txt.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.magiclink:
      repo_url_shorthand: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Snippets:
      - snippets/index.md
  - Scripts:
      - scripts/index.md
  - Tools:
      - tools/index.md
  - Apps:
      - apps/index.md
  - macOS:
      - macos/index.md
      - Scripts: macos/scripts.md
      - Snippets: macos/snippets.md
      - Notes: macos/notes.md
  - Jamf:
      - jamf/index.md
      - Scripts: jamf/scripts.md
      - Snippets: jamf/snippets.md
      - Notes: jamf/notes.md
  - Linux:
      - linux/index.md
      - Scripts: linux/scripts.md
      - Snippets: linux/snippets.md
      - Notes: linux/notes.md
  - Windows:
      - windows/index.md
      - Scripts: windows/scripts.md
      - Snippets: windows/snippets.md
      - Notes: windows/notes.md
  - Tags: tags.md
